    const sec = label => `<tr><td colspan="7" style="font-weight:bold;background-color:#17808F;color:white;">${esc(label)}</td></tr>`;
    const head = `<tr><th>${t.xlNo}</th><th>${t.xlItem}</th><th>${t.xlPrice}</th><th>${t.xlQty}</th><th>Amount</th><th>${t.xlCategory}</th><th>${t.xlPlace}</th></tr>`;
    const line = (e, i) => `<tr><td>${i + 1}</td><td style="text-align:left;">${dm(e.date)} ${esc(e.memo)}</td><td class="number">${N(Number(e.unitPrice) || amt(e))}</td><td>${e.qty || 1}</td><td class="number">${N(amt(e))}</td><td>${e.type === 'fund' ? '-' : esc(catLabel(e.category))}</td><td>${esc(e.place)}</td></tr>`;
    const total = (label, v, bg) => `<tr style="font-weight:bold;background-color:${bg};"><td colspan="4">${esc(label)}</td><td class="number">${N(v)}</td><td colspan="2"></td></tr>`;
    const infoRow = (k, v) => `<tr><td colspan="2" style="font-weight:bold;">${esc(k)}</td><td colspan="5" style="text-align:left;">${esc(v)}</td></tr>`;
    const catT = Object.entries(sm.byCat).sort((a, b) => b[1] - a[1]);
    const plT = Object.entries(sm.byPlace).sort((a, b) => b[1] - a[1]);
    const funds = list.filter(e => e.type === 'fund'), spends = list.filter(e => e.type !== 'fund');
    const body = `
      <tr><td colspan="7" style="font-size:18px;font-weight:bold;">OrderList · ${esc(curTour.name)}</td></tr>
      ${infoRow(t.xlGuide, curTour.guide)}${infoRow(t.xlPeriod, `${curTour.startDate} ~ ${curTour.endDate}`)}${curTour.pax ? infoRow(t.pax, String(curTour.pax)) : ''}${infoRow(t.xlStatus, curTour.status === 'settled' ? t.xlSettled : t.xlOpen)}${infoRow('', U === 1000 ? t.xlUnitNote1000 : t.xlUnitNote1)}
      ${sec(t.xlSpendSection)}${head}${spends.map(line).join('')}${total('Total Amount', sm.spent, '#f1f3f5')}
      ${funds.length ? sec(t.xlFundSection) + head + funds.map(line).join('') + total(t.xlTotalFunds, sm.funds, '#f1f3f5') : ''}
      ${total(info.xl, Math.abs(bal), '#ffe8a8')}
      ${catT.length ? sec(t.xlByCategory) + catT.map(([c, v]) => `<tr><td colspan="4">${esc(catLabel(c))}</td><td class="number">${N(v)}</td><td colspan="2"></td></tr>`).join('') : ''}
      ${plT.length ? sec(t.xlByPlace) + plT.map(([k, v]) => { const [c, p] = k.split('\u0001'); return `<tr><td colspan="4">${esc(p)} (${esc(catLabel(c))})</td><td class="number">${N(v)}</td><td colspan="2"></td></tr>`; }).join('') : ''}`;
    downloadBlob(new Blob(['\ufeff' + xlWrap(body)], { type: 'application/vnd.ms-excel;charset=utf-8' }), `${safeName(curTour.name)}_${safeName(curTour.guide)}_${curTour.startDate}.xls`);
  }
  function exportAllExcel() {
    const t = T();
    if (!tours.length) { toast(t.noData); return; }
    const sorted = [...tours].sort((a, b) => (a.startDate || '').localeCompare(b.startDate || ''));
    let tf = 0, ts = 0;
    const rows = sorted.map(x => {
      const f = x.fundTotal || 0, s = x.spendTotal || 0;
      tf += f; ts += s;
      return `<tr><td>${esc(x.name)}</td><td>${esc(x.guide)}</td><td>${esc(x.startDate)} ~ ${esc(x.endDate)}</td><td>${x.status === 'settled' ? t.xlSettled : t.xlOpen}</td><td class="number">${f}</td><td class="number">${s}</td><td class="number">${f - s}</td></tr>`;
    }).join('');
    const body = `<tr><th>${t.xlTour}</th><th>${t.xlGuide}</th><th>${t.xlPeriod}</th><th>${t.xlStatus}</th><th>${t.xlFunds}</th><th>${t.xlSpent}</th><th>${t.xlBalance}</th></tr>${rows}
      <tr style="font-weight:bold;background-color:#e2e8f0;"><td colspan="4"></td><td class="number">${tf}</td><td class="number">${ts}</td><td class="number">${tf - ts}</td></tr>`;
    downloadBlob(new Blob(['\ufeff' + xlWrap(body)], { type: 'application/vnd.ms-excel;charset=utf-8' }), `Tours_Summary_${todayStr()}.xls`);
  }
  async function exportBackup() {
    try {
      const d = await DB.dumpAll();
      downloadBlob(new Blob([JSON.stringify({ app: 'tour-settlement', version: 3, exportedAt: new Date().toISOString(), ...d }, null, 2)], { type: 'application/json' }), `tour-settlement-backup-${todayStr()}.json`);
    } catch (e) { console.error(e); toast(T().writeFail); }
  }
  async function importBackup(file) {
    const t = T();
    let data;
    try { data = JSON.parse(await file.text()); } catch (e) { toast(t.importFail); return; }
    if (!data || !Array.isArray(data.tours)) { toast(t.importFail); return; }
    if (!(await askConfirm(fill(t.confirmImport, { n: data.tours.length }), t.confirmOk))) return;
    await DB.importAll(data);
    toast(t.importDone);
    stopTourWatch();
    go('tours');
  }
  async function resetAll() {
    const t = T();
    if (!(await askConfirm(t.confirmReset, t.delete))) return;
    await DB.resetAll();
    stopTourWatch();
    toast(t.resetDone);
    go('tours');
  }

  /* =====================================================
     시작
     ===================================================== */
  const cfgCb = c => { config = normalizeConfig(c); renderAll(); };
  function stopAll() {
    stopTourWatch();
    if (unsubConfig) { unsubConfig(); unsubConfig = null; }
    if (unsubTours) { unsubTours(); unsubTours = null; }
  }
  function startAdmin() {
    role = 'admin';
    stopAll();
    unsubConfig = DB.watchConfig(cfgCb);
    unsubTours = DB.watchTours((list, meta) => { tours = list; if (meta && meta.error) toast(T().errLoad + ' [' + meta.error + ']'); renderAll(); });
    go('tours');
  }
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(Object.assign(new Error('timeout'), { code: 'timeout' })), ms))]);
  function showBootError(e) {
    console.error(e);
    const x = explainError(e);
    $('bootMsg').textContent = T().connectFail + '\n\n' + x.hint + '\n[' + x.code + ']';
    $('bootRetryWrap').classList.remove('hidden');
    if (view !== 'boot') go('boot');
  }
  async function boot() {
    const t = T();
    $('bootMsg').textContent = t.loading;
    $('bootRetryWrap').classList.add('hidden');
    go('boot');
    const params = new URLSearchParams(location.search);
    const pl = params.get('l');
    if (pl && translations[pl] && !localStorage.getItem('myLang') && lang !== pl) { lang = pl; applyI18n(); $('bootMsg').textContent = T().loading; }
    let tid = params.get('t');
    if (params.get('admin') === '1') { localStorage.removeItem('guideTour'); tid = null; }
    else if (tid) localStorage.setItem('guideTour', tid);
    else tid = localStorage.getItem('guideTour');
    try {
      await withTimeout(DB.init(), 20000);
      DB.onError(() => toast(T().writeFail));
      if (tid) {
        role = 'guide';
        await withTimeout(DB.ensureGuideAuth(), 20000);
        unsubConfig = DB.watchConfig(cfgCb);
        openTour(tid);
      } else {
        role = 'admin';
        if (DB.mode === 'firebase' && !DB.isAdmin()) { go('login'); return; }
        startAdmin();
      }
    } catch (e) {
      showBootError(e);
    }
  }
  async function doLogin() {
    $('loginErr').textContent = '';
    $('loginBtn').disabled = true;
    try {
      await DB.login($('loginEmail').value.trim(), $('loginPw').value);
      $('loginPw').value = '';
      startAdmin();
    } catch (e) {
      console.error(e);
      $('loginErr').textContent = T().loginFail;
    }
    $('loginBtn').disabled = false;
  }

  function init() {
    window.addEventListener('error', ev => { if (view === 'boot') showBootError({ code: 'js-error', message: ev.message }); });
    window.addEventListener('unhandledrejection', ev => { if (view === 'boot') showBootError(ev.reason); });
    document.addEventListener('click', ev => {
      const g = ev.target.closest('[data-go]');
      if (!g) return;
      let target = g.dataset.go;
      if (target === 'tours') {
        if (role === 'guide') target = tourMissing ? 'notfound' : 'tour';
        else stopTourWatch();
      }
      go(target);
    });
    $('backBtn').onclick = () => { const bt = backTarget(view); if (view === 'tour') stopTourWatch(); if (bt) go(bt); };
    $('moreBtn').onclick = () => {
      const adm = role === 'admin';   // 미리보기/삭제는 사장님만 (나머지 메뉴는 동일)
      $('morePreview').classList.toggle('hidden', !adm);
      $('moreDelete').classList.toggle('hidden', !adm);
      openSheet('moreSheet');
    };
    $('fab').onclick = () => { if (view === 'tours') openTourSheet(null); else openEntrySheet(null); };
    $('backdrop').onclick = closeSheet;
    document.querySelectorAll('[data-close]').forEach(b => { b.onclick = closeSheet; });
    document.addEventListener('keydown', ev => {
      if (ev.key !== 'Escape') return;
      if ($('dialog').classList.contains('open')) $('dlgCancel').click(); else closeSheet();
    });
    $('bootRetry').onclick = boot;

    bindSeg($('unitSeg'), v => { localStorage.setItem('myUnit', v); renderAll(); });
    bindChips($('guideLangChips'), v => { draftTourLang = v; renderTourSheet(); });
    $('langBtn').onclick = () => { const order = ['ko', 'en', 'vi']; lang = order[(order.indexOf(lang) + 1) % order.length]; localStorage.setItem('myLang', lang); applyI18n(); renderAll(); };
    bindSeg($('langSeg'), v => { lang = v; localStorage.setItem('myLang', lang); applyI18n(); renderAll(); });
    bindSeg($('bdSeg'), v => { bdMode = v; renderTour(); });
    bindSeg($('statusSeg'), v => { statusFilter = v; renderTours(); });
    bindChips($('guideChips'), v => { guideFilter = v; renderTours(); });
    $('tourList').onclick = ev => { const b = ev.target.closest('.row[data-id]'); if (b) openTour(b.dataset.id); };
    $('tourEntries').onclick = ev => { const b = ev.target.closest('.row[data-id]'); if (b) openEntrySheet(b.dataset.id); };

    // 로그인
    $('loginBtn').onclick = doLogin;
    $('loginPw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    $('logoutBtn').onclick = async () => { try { await DB.logout(); } catch (e) {} stopAll(); tours = []; go('login'); };
    $('toAdminBtn').onclick = () => { localStorage.removeItem('guideTour'); location.href = location.href.split(/[?#]/)[0]; };

    // 투어 상세 동작
    $('addFundBtn').onclick = () => openEntrySheet(null, 'fund');
    $('shareBtn').onclick = shareLink;
    $('settleBtn').onclick = toggleSettle;
    $('moreEdit').onclick = () => openTourSheet(curTourId);
    $('moreExcel').onclick = () => { closeSheet(); exportTourExcel(); };
    $('morePreview').onclick = () => { location.href = linkFor(curTourId, (curTour && curTour.guideLang) || 'vi'); };
    $('moreDelete').onclick = deleteTour;

    // 내역 시트
    bindSeg($('entryTypeSeg'), v => { draft.type = v; renderEntrySheet(); });
    $('entryAmount').addEventListener('input', e => { fmtInput(e.target); updateTotals(); });
    $('entryQty').addEventListener('input', e => { e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 4); updateTotals(); });
    $('qtyMinus').onclick = () => { $('entryQty').value = String(Math.max(1, readQty() - 1)); updateTotals(); };
    $('qtyPlus').onclick = () => { $('entryQty').value = String(Math.min(9999, readQty() + 1)); updateTotals(); };
    $('paxBtn').onclick = () => { if (curPax()) { $('entryQty').value = String(curPax()); updateTotals(); } };
    $('tourPax').addEventListener('input', e => { e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 3); });
    bindChips($('vendorChips'), pickVendor);
    bindChips($('menuChips'), applyMenu);
    bindChips($('catChips'), v => { draft.category = draft.category === v ? '' : v; renderEntrySheet(); });
    bindChips($('dateChips'), v => { $('entryDate').value = v; renderEntrySheet(); });
    $('entryDate').addEventListener('change', renderEntrySheet);
    $('entrySave').onclick = () => saveEntry(false);
    $('entrySaveMore').onclick = () => saveEntry(true);
    $('entryDelete').onclick = deleteEntry;

    // 투어 시트
    $('tourGuide').addEventListener('input', renderTourSheet);
    bindChips($('guidePickChips'), v => { $('tourGuide').value = v; renderTourSheet(); });
    $('tourStart').addEventListener('change', () => { if ($('tourEnd').value < $('tourStart').value) $('tourEnd').value = shiftDay($('tourStart').value, 3); renderTourSheet(); });
    $('tourEnd').addEventListener('change', renderTourSheet);
    bindChips($('daysChips'), v => { const s = $('tourStart').value || todayStr(); $('tourStart').value = s; $('tourEnd').value = shiftDay(s, Number(v) - 1); renderTourSheet(); });
    $('tourFund').addEventListener('input', e => fmtInput(e.target));
    $('tourSave').onclick = saveTour;

    // 설정 하위
    $('addCatBtn').onclick = () => openCatSheet(null);
    $('catList').onclick = ev => { const b = ev.target.closest('.row[data-i]'); if (b) openCatSheet(Number(b.dataset.i)); };
    $('catSave').onclick = saveCat;
    $('catDelete').onclick = deleteCat;
    $('catName').addEventListener('keydown', e => { if (e.key === 'Enter') saveCat(); });

    // 업체 · 메뉴
    $('addPlaceBtn').onclick = openPlaceSheet;
    $('placeList').onclick = ev => { const b = ev.target.closest('.row[data-id]'); if (b) { curVendorId = b.dataset.id; go('vendor'); } };
    bindChips($('placeCatChips'), v => { draftVendor.category = v; renderPlaceSheet(); });
    $('placeSave').onclick = savePlace;
    $('placeName').addEventListener('keydown', e => { if (e.key === 'Enter') savePlace(); });
    $('addItemBtn').onclick = () => openItemSheet(null);
    $('itemList').onclick = ev => { const b = ev.target.closest('.row[data-id]'); if (b) openItemSheet(b.dataset.id); };
    bindChips($('itemQtyChips'), v => { itemQtyMode = v; renderItemSheet(); });
    $('itemAmount').addEventListener('input', e => { fmtInput(e.target); renderItemSheet(); });
    $('itemSave').onclick = saveItem;
    $('itemDelete').onclick = deleteItem;
    $('vendorDeleteBtn').onclick = deleteVendor;

    $('dataExcelAll').onclick = exportAllExcel;
    $('dataBackup').onclick = exportBackup;
    $('dataRestore').onclick = () => $('importFile').click();
    $('importFile').onchange = e => { const f = e.target.files[0]; if (f) importBackup(f); e.target.value = ''; };
    $('dataReset').onclick = resetAll;

    document.addEventListener('visibilitychange', () => { if (!document.hidden) renderAll(); });

    applyI18n();
    boot();
  }

  init();
})();
</script>
</body>
</html>
