<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10303A">
<title>투어정산</title>
<style>
  :root {
    --ink: #10303A;
    --lagoon: #17808F;
    --foam: #EDF3F2;
    --surface: #FFFFFF;
    --text: #10303A;
    --muted: #62797F;
    --line: #DDE7E6;
    --chip: #E3EEEC;
    --amber: #F0A32F;
    --amber-ink: #3A2600;
    --income: #1E8E5A;
    --expense: #C8433F;
    --hero-bg: #10303A;
    --hero-text: #FFFFFF;
    --hero-sub: rgba(255,255,255,.72);
    --hero-track: rgba(255,255,255,.16);
    --shadow: 0 10px 30px rgba(16,48,58,.16);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --foam: #0B1A1F;
      --surface: #12262C;
      --text: #E7F1F0;
      --muted: #8CA5AA;
      --line: #1F363D;
      --chip: #1A3138;
      --income: #4CC38A;
      --expense: #FF7A72;
      --hero-bg: #16414D;
      --shadow: 0 10px 30px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-padding-top: 80px; }
  body {
    margin: 0;
    background: var(--foam);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.4;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  input { font-size: 16px; }
  .hidden { display: none !important; }
  :focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100dvh;
    position: relative;
    padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px));
  }
  @media (min-width: 520px) { .app { box-shadow: 0 0 0 1px var(--line); background: var(--foam); } }

  /* ---------- 상단 바 ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 8px;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 10px;
    background: color-mix(in srgb, var(--foam) 92%, transparent);
    backdrop-filter: blur(10px);
  }
  .topbar h1 { flex: 1; margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%;
    border: 0; background: var(--chip); font-size: 18px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center; flex: none;
  }
  .period-pill {
    display: inline-flex; align-items: center; gap: 6px;
    height: 36px; padding: 0 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface);
    font-size: 13px; font-weight: 700; white-space: nowrap;
  }

  /* ---------- 공통 ---------- */
  .view { padding: 4px 0 0; }
  .section { padding: 0 16px; margin-bottom: 26px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .section-head h2 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
  .link { background: none; border: 0; color: var(--lagoon); font-weight: 700; font-size: 14px; padding: 6px 0 6px 8px; }
  .surface { background: var(--surface); border-radius: 18px; border: 1px solid var(--line); }

  .seg { display: flex; gap: 4px; padding: 4px; background: var(--chip); border-radius: 14px; }
  .seg button { flex: 1; white-space: nowrap; border: 0; background: none; padding: 9px 8px; border-radius: 11px; font-weight: 700; font-size: 14px; color: var(--muted); }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(16,48,58,.18); }
  .seg.small { display: inline-flex; padding: 3px; }
  .seg.small button { flex: none; padding: 6px 12px; font-size: 13px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; margin: 0 -20px; padding-left: 20px; padding-right: 20px; scrollbar-width: none; }
  .chips.scroll::-webkit-scrollbar { display: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    min-height: 40px; padding: 0 14px; border-radius: 999px;
    border: 1.5px solid transparent; background: var(--chip);
    font-weight: 700; font-size: 14px; white-space: nowrap;
  }
  .chip.on { background: var(--ink); color: #fff; }
  @media (prefers-color-scheme: dark) { .chip.on { background: var(--amber); color: var(--amber-ink); } }
  .chip.quick { background: transparent; border-color: var(--lagoon); color: var(--lagoon); }

  .btn { min-height: 48px; padding: 0 20px; border-radius: 14px; border: 0; font-weight: 800; font-size: 16px; }
  .btn.primary { background: var(--ink); color: #fff; }
  @media (prefers-color-scheme: dark) { .btn.primary { background: var(--amber); color: var(--amber-ink); } }
  .btn.ghost { background: var(--chip); color: var(--text); }
  .btn.danger { background: var(--expense); color: #fff; }
  .btn.danger-ghost { background: transparent; color: var(--expense); border: 1.5px solid var(--expense); }
  .btn.block { width: 100%; }

  .field { margin-bottom: 18px; }
  .field > label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
  .field input[type=text], .field input[type=date], .field input[type=search] {
    width: 100%; height: 48px; padding: 0 14px; border-radius: 12px;
    border: 1.5px solid var(--line); background: var(--surface);
  }
  .field input:focus { border-color: var(--lagoon); outline: none; }

  .empty { text-align: center; padding: 36px 20px; color: var(--muted); }
  .empty b { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }

  /* ---------- 홈: 정산 봉투 ---------- */
  .envelope {
    margin: 4px 16px 24px; padding: 22px 20px 20px; border-radius: 26px;
    background: var(--hero-bg); color: var(--hero-text);
  }
  .env-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; color: var(--hero-sub); }
  .env-balance { margin: 8px 0 18px; font-size: 40px; font-weight: 800; line-height: 1.05; letter-spacing: -0.03em; }
  .env-balance small { font-size: 15px; font-weight: 700; margin-left: 6px; color: var(--hero-sub); letter-spacing: 0; }
  .env-balance.neg { color: #FFB1A8; }
  .env-bar { height: 10px; border-radius: 999px; background: var(--hero-track); overflow: hidden; }
  .env-bar i { display: block; height: 100%; border-radius: 999px; background: var(--amber); }
  .env-bar i.over { background: #FF8A80; }
  .env-bar-note { display: flex; justify-content: space-between; margin: 8px 0 16px; font-size: 12.5px; color: var(--hero-sub); }
  .env-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .env-stats div { padding-top: 12px; border-top: 1px solid var(--hero-track); }
  .env-stats span { display: block; font-size: 12.5px; color: var(--hero-sub); margin-bottom: 2px; }
  .env-stats strong { font-size: 18px; font-weight: 800; }

  .bd-row { margin-bottom: 14px; }
  .bd-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; margin-bottom: 6px; }
  .bd-name { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bd-name small { color: var(--muted); font-weight: 600; margin-left: 6px; }
  .bd-val { font-weight: 800; white-space: nowrap; }
  .bd-val em { font-style: normal; font-weight: 600; color: var(--muted); font-size: 12.5px; margin-left: 6px; }
  .bar { height: 8px; border-radius: 999px; background: var(--chip); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 999px; }

  /* ---------- 내역 행 ---------- */
  .rows { background: var(--surface); border-radius: 18px; border: 1px solid var(--line); padding: 0 14px; }
  .row {
    display: flex; align-items: center; gap: 12px; width: 100%;
    background: none; border: 0; border-bottom: 1px solid var(--line);
    padding: 12px 0; text-align: left; min-height: 64px;
  }
  .row:last-child { border-bottom: 0; }
  .ico { width: 40px; height: 40px; border-radius: 12px; background: var(--chip); display: inline-flex; align-items: center; justify-content: center; font-size: 19px; flex: none; }
  .ico.inc { background: color-mix(in srgb, var(--income) 18%, transparent); }
  .row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .row-title { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-sub { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-amt { font-weight: 800; white-space: nowrap; }
  .row-amt.income { color: var(--income); }
  .row-amt.expense { color: var(--expense); }
  .row-chev { color: var(--muted); font-size: 20px; }

  .day-head { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 4px 8px; font-size: 13px; color: var(--muted); font-weight: 700; }
  .day-group { margin-bottom: 18px; }

  .searchbar { display: flex; gap: 8px; padding: 0 16px 12px; }
  .searchbar input { flex: 1; height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); }
  .searchbar input:focus { border-color: var(--lagoon); outline: none; }
  .list-tools { padding: 0 16px; margin-bottom: 12px; }
  .list-summary { padding: 0 20px; margin-bottom: 12px; font-size: 13px; color: var(--muted); font-weight: 600; }

  /* ---------- 설정 ---------- */
  .menu { background: var(--surface); border-radius: 18px; border: 1px solid var(--line); padding: 0 14px; }
  .menu-item { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 14px 0; text-align: left; min-height: 68px; }
  .menu-item:last-child { border-bottom: 0; }
  .mi-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .mi-main b { font-size: 15.5px; }
  .mi-main small { color: var(--muted); font-size: 12.5px; }
  .set-label { font-size: 13px; font-weight: 700; color: var(--muted); margin: 0 4px 8px; }
  .group-label { font-size: 13px; font-weight: 800; color: var(--muted); margin: 16px 4px 8px; }
  .data-note { margin: 16px 4px 0; font-size: 13px; color: var(--muted); }
  .data-btns { display: flex; flex-direction: column; gap: 10px; }
  .data-btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); text-align: left; }
  .data-btn.danger b { color: var(--expense); }

  /* ---------- 하단 탭 / FAB ---------- */
  .tabbar {
    position: fixed; z-index: 20; bottom: 0; left: 50%; transform: translateX(-50%);
    width: min(100%, 480px);
    display: grid; grid-template-columns: repeat(3, 1fr);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
    background: color-mix(in srgb, var(--surface) 94%, transparent);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
  }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; padding: 6px 0; font-size: 12px; font-weight: 700; color: var(--muted); min-height: 52px; }
  .tab span { font-size: 21px; line-height: 1.1; filter: grayscale(1); opacity: .65; }
  .tab.on { color: var(--text); }
  .tab.on span { filter: none; opacity: 1; }
  .fab {
    position: fixed; z-index: 21;
    bottom: calc(76px + env(safe-area-inset-bottom, 0px));
    right: max(16px, calc(50% - 240px + 16px));
    height: 56px; padding: 0 22px 0 18px; border-radius: 999px; border: 0;
    background: var(--amber); color: var(--amber-ink);
    font-weight: 800; font-size: 16px; display: inline-flex; align-items: center; gap: 8px;
    box-shadow: var(--shadow);
  }
  .fab b { font-size: 26px; line-height: 1; font-weight: 700; margin-top: -2px; }

  /* ---------- 시트 ---------- */
  .backdrop { position: fixed; inset: 0; z-index: 30; background: rgba(8,21,26,.5); opacity: 0; visibility: hidden; transition: opacity .2s; }
  .backdrop.open { opacity: 1; visibility: visible; }
  .sheet {
    position: fixed; z-index: 40; left: 50%; bottom: 0;
    width: min(100%, 480px); max-height: 92dvh;
    display: flex; flex-direction: column;
    background: var(--surface); border-radius: 28px 28px 0 0;
    transform: translate(-50%, 100%); visibility: hidden;
    transition: transform .26s cubic-bezier(.2,.8,.2,1), visibility 0s .26s;
  }
  .sheet.open { transform: translate(-50%, 0); visibility: visible; transition: transform .26s cubic-bezier(.2,.8,.2,1), visibility 0s; }
  .sheet-grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 10px auto 0; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 20px 4px; }
  .sheet-head h3 { margin: 0; font-size: 18px; font-weight: 800; }
  .sheet-body { padding: 12px 20px 8px; overflow-y: auto; overscroll-behavior: contain; }
  .sheet-foot { display: flex; gap: 10px; padding: 12px 20px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
  .sheet-foot .btn.primary { flex: 1; }
  .amount-wrap { display: flex; align-items: baseline; gap: 8px; margin: 16px 0 20px; border-bottom: 2px solid var(--line); padding-bottom: 8px; }
  .amount-wrap:focus-within { border-color: var(--lagoon); }
  .amount-wrap input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 38px; font-weight: 800; letter-spacing: -0.02em; padding: 0; }
  .amount-wrap span { font-weight: 700; color: var(--muted); }
  .range-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* ---------- 다이얼로그 / 토스트 ---------- */
  .dialog-wrap { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(8,21,26,.55); }
  .dialog-wrap.open { display: flex; }
  .dialog { width: min(100%, 340px); background: var(--surface); border-radius: 22px; padding: 22px 20px 16px; }
  .dialog p { margin: 0 0 18px; white-space: pre-line; font-size: 15.5px; line-height: 1.5; }
  .dialog .acts { display: flex; gap: 10px; }
  .dialog .acts .btn { flex: 1; min-height: 46px; }
  .toast {
    position: fixed; z-index: 70; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px);
    transform: translate(-50%, -12px); opacity: 0; pointer-events: none;
    background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 999px;
    font-weight: 700; font-size: 14px; max-width: 90vw; text-align: center;
    transition: opacity .2s, transform .2s;
  }
  @media (prefers-color-scheme: dark) { .toast { background: #E7F1F0; color: #0B1A1F; } }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ---------- v3 추가 ---------- */
  .demo-banner { margin: 0 16px 10px; padding: 8px 12px; border-radius: 12px; font-size: 12.5px; font-weight: 700;
    background: color-mix(in srgb, var(--amber) 24%, var(--surface)); color: var(--text); }
  .status { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; background: var(--hero-track); color: var(--hero-text); white-space: nowrap; }
  .status.done { background: var(--amber); color: var(--amber-ink); }
  .env-label { margin-top: 12px; font-size: 14px; font-weight: 700; color: var(--hero-sub); }
  .envelope .env-balance { margin-top: 2px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .btn.sm { min-height: 46px; font-size: 14.5px; padding: 0 12px; }
  .notice { margin: 0 16px 18px; padding: 12px 14px; border-radius: 14px; background: var(--chip); font-size: 13.5px; font-weight: 600; }
  .row-right { display: flex; flex-direction: column; align-items: flex-end; flex: none; }
  .row-right .row-sub { font-size: 12px; }
  .row.static { cursor: default; }
  .login-wrap { padding: 36px 20px; }
  .login-wrap h2 { font-size: 24px; margin: 0 0 6px; letter-spacing: -0.02em; }
  .login-wrap p { color: var(--muted); margin: 0 0 24px; }
  .err { color: var(--expense); font-weight: 700; font-size: 14px; margin: 0 0 14px; min-height: 20px; }
  .tour-top { padding: 0 16px; margin-bottom: 14px; }
  .field input:disabled { background: var(--chip); color: var(--muted); }
  .more-list .menu-item { min-height: 58px; }
  .spinner { text-align: center; padding: 80px 20px; color: var(--muted); font-weight: 700; white-space: pre-line; }
  .tabbar.two { grid-template-columns: repeat(2, 1fr); }
  .vendor-head { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
  .vendor-head b { font-size: 18px; }
  .lbl { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-top: 16px; }
  .price-preview { min-height: 20px; margin: -12px 0 14px; font-size: 13.5px; font-weight: 700; color: var(--lagoon); }
  .qty-row { display: flex; align-items: center; gap: 8px; }
  .qty-row input { width: 76px; height: 44px; text-align: center; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-size: 20px; font-weight: 800; }
  .qty-row input:focus { border-color: var(--lagoon); outline: none; }
  .qty-row .icon-btn { width: 44px; height: 44px; font-size: 22px; font-weight: 700; }
  .qty-row .chip { margin-left: auto; }
  .total-row { display: flex; justify-content: space-between; align-items: baseline; margin: 2px 0 18px; padding: 12px 14px; border-radius: 14px; background: var(--chip); font-weight: 700; }
  .total-row strong { font-size: 20px; font-weight: 800; }
</style>
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <button class="icon-btn hidden" id="backBtn" data-i18n-aria="back">‹</button>
    <h1 id="topTitle"></h1>
    <button class="period-pill hidden" id="langBtn" aria-label="language">🌐 <span id="langBtnText"></span></button>
    <button class="icon-btn hidden" id="moreBtn" data-i18n-aria="more">⋯</button>
  </header>
  <div class="demo-banner hidden" id="demoBanner" data-i18n="demoBanner"></div>

  <main>
    <!-- ===== 로딩 / 연결 실패 ===== -->
    <section class="view" id="view-boot">
      <div class="spinner" id="bootMsg">…</div>
      <div class="section hidden" id="bootRetryWrap"><button class="btn primary block" id="bootRetry" data-i18n="retry"></button></div>
    </section>

    <!-- ===== 관리자 로그인 ===== -->
    <section class="view hidden" id="view-login">
      <div class="login-wrap">
        <h2 data-i18n="loginTitle"></h2>
        <p data-i18n="loginHint"></p>
        <div class="field"><label data-i18n="loginEmail"></label><input id="loginEmail" type="text" inputmode="email" autocomplete="username" autocapitalize="off"></div>
        <div class="field"><label data-i18n="loginPw"></label><input id="loginPw" type="password" autocomplete="current-password"></div>
        <div class="err" id="loginErr"></div>
        <button class="btn primary block" id="loginBtn" data-i18n="loginBtn"></button>
      </div>
    </section>

    <!-- ===== 관리자 홈: 투어 목록 ===== -->
    <section class="view hidden" id="view-tours">
      <div class="envelope">
        <div class="env-top"><span data-i18n="pendingTitle"></span><span id="pendingCount" class="num"></span></div>
        <div class="env-stats" style="margin-top:14px;">
          <div><span data-i18n="toReceive"></span><strong class="num" id="sumReceive">0</strong></div>
          <div><span data-i18n="toPay"></span><strong class="num" id="sumPay">0</strong></div>
        </div>
      </div>
      <div class="section" style="margin-bottom:12px;"><div class="chips scroll" id="guideChips" style="margin:0 -16px; padding-left:16px; padding-right:16px;"></div></div>
      <div class="section" style="margin-bottom:14px;">
        <div class="seg" id="statusSeg">
          <button data-v="open" class="on" data-i18n="statusOpen"></button>
          <button data-v="settled" data-i18n="statusSettled"></button>
        </div>
      </div>
      <div class="section" id="tourList"></div>
    </section>

    <!-- ===== 투어 상세 (관리자/가이드 공통) ===== -->
    <section class="view hidden" id="view-tour">
      <div class="envelope">
        <div class="env-top"><span id="tourMeta"></span><span class="status" id="tourStatus"></span></div>
        <div class="env-label" id="resultLabel"></div>
        <div class="env-balance num" id="tourBalance"><span id="tourBalanceNum">0</span><small>VND</small></div>
        <div class="env-bar"><i id="tourBarFill" style="width:0%"></i></div>
        <div class="env-bar-note"><span id="tourBarText"></span><span id="tourBarPct" class="num"></span></div>
        <div class="env-stats">
          <div><span id="lblFunds"></span><strong class="num" id="tourFunds">0</strong></div>
          <div><span data-i18n="spent"></span><strong class="num" id="tourSpent">0</strong></div>
        </div>
      </div>
      <div class="notice hidden" id="tourNotice"></div>

      <div class="section" id="tourActions">
        <div class="actions">
          <button class="btn ghost sm" id="addFundBtn" data-i18n="addFund"></button>
          <button class="btn ghost sm" id="shareBtn" data-i18n="shareLink"></button>
        </div>

    }
  };
  const LOCALES = { ko: 'ko-KR', en: 'en-US', vi: 'vi-VN' };
  const LANG_NAMES = { ko: '한국어', en: 'English', vi: 'Tiếng Việt' };

  /* =====================================================
     기본값
     ===================================================== */
  // 저장되는 기본 카테고리 이름(= 기준값)은 한국어. 화면에는 보는 사람의 언어로 번역해서 보여줘요.
  const defaultCategories = {
    ko: ['식사비', '입장료', '교통비', '팁', '쇼핑', '기타'],
    en: ['Meals', 'Admission', 'Transport', 'Tips', 'Shopping', 'Other'],
    vi: ['Ăn uống', 'Vé vào cổng', 'Di chuyển', 'Tiền tip', 'Mua sắm', 'Khác']
  };
  const CANON = defaultCategories.ko;
  const legacyDefaults = {
    ko: ['식비', '교통비', '쇼핑', '문화/여가', '기타'],
    en: ['Food', 'Transport', 'Shopping', 'Culture/Leisure', 'Other'],
    vi: ['Ăn uống', 'Di chuyển', 'Mua sắm', 'Văn hóa/Giải trí', 'Khác']
  };
  const legacyMap = [0, 2, 4, 1, 5];
  const CAT_ICONS = ['🍽️', '🎟️', '🚕', '💵', '🛍️', '📦'];
  const BAR_COLORS = ['#17808F', '#F0A32F', '#C8433F', '#6C8F3A', '#7A5BA8', '#3D6FB6', '#B5702A', '#4F8B7A'];
  const defaultPresetNames = {
    ko: [['점심 식사', 0, 'pax'], ['저녁 식사', 0, 'pax'], ['입장료', 1, 'pax'], ['택시/차량', 2, '1'], ['팁', 3, '1']],
    en: [['Lunch', 0, 'pax'], ['Dinner', 0, 'pax'], ['Admission fee', 1, 'pax'], ['Taxi/Vehicle', 2, '1'], ['Tip', 3, '1']],
    vi: [['Bữa trưa', 0, 'pax'], ['Bữa tối', 0, 'pax'], ['Vé vào cổng', 1, 'pax'], ['Taxi/Xe', 2, '1'], ['Tiền tip', 3, '1']]
  };

  /* =====================================================
     유틸
     ===================================================== */
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = n => (Number(n) || 0).toLocaleString('en-US');
  const pad2 = n => String(n).padStart(2, '0');
  const dstr = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const todayStr = () => dstr(new Date());
  const parseD = str => { const [y, m, d] = str.split('-').map(Number); return new Date(y, m - 1, d); };
  const shiftDay = (str, n) => { const d = parseD(str); d.setDate(d.getDate() + n); return dstr(d); };
  const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
  const newId = p => (p || 'e') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const fill = (s, vars) => s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
  const mdText = str => str ? str.slice(5).replace('-', '.') : '';
  const sameList = (a, b) => a.length === b.length && a.every((c, i) => c === b[i]);
  const clone = o => JSON.parse(JSON.stringify(o));
  const amt = e => Number(e.amount) || 0;

  const Store = {
    get(key, fallback) {
      try {
        const v = JSON.parse(localStorage.getItem(key));
        return v === null || v === undefined ? fallback : v;
      } catch (e) { return fallback; }
    },
    set(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { toast('⚠️ storage error'); }
    },
    remove(key) { try { localStorage.removeItem(key); } catch (e) {} }
  };

  /* =====================================================
     데이터 계층 ① 데모 모드 (이 기기의 localStorage)
     ===================================================== */
  const LocalDB = (function () {
    const KEY = 'tourAppData';
    let data = Store.get(KEY, null);
    const subs = new Set();

    function persist() { Store.set(KEY, data); subs.forEach(s => s.fire()); }
    function payload(kind, id) {
      switch (kind) {
        case 'config': return data.config ? clone(data.config) : null;
        case 'tours': return clone(data.tours).sort((a, b) => (b.startDate || '').localeCompare(a.startDate || '') || (b.createdAt || '').localeCompare(a.createdAt || ''));
        case 'tour': { const t = data.tours.find(x => x.id === id); return t ? clone(t) : null; }
        case 'entries': return clone(data.entries[id] || []);
      }
    }
    function sub(kind, id, cb) {
      const s = { fire() { cb(payload(kind, id), { fromCache: false }); } };
      subs.add(s);
      s.fire();
      return () => subs.delete(s);
    }
    function delta(tour, e, sign) {
      const a = amt(e);
      if (e.type === 'fund') tour.fundTotal = (tour.fundTotal || 0) + sign * a;
      else tour.spendTotal = (tour.spendTotal || 0) + sign * a;
      tour.entryCount = (tour.entryCount || 0) + sign;
    }
    const findTour = id => data.tours.find(x => x.id === id);

    // 이전 버전(기간별 장부) 데이터가 있으면 '이전 기록' 투어 하나로 옮겨 담음
    function migrateLegacy() {
      const old = Store.get('myExpenses', []);
      if (!Array.isArray(old) || old.length === 0) return;
      let cats = Store.get('myCategories', null);
      cats = Array.isArray(cats) && cats.length ? cats : null;
      let mapCat = c => c;
      for (const l in legacyDefaults) {
        if (cats && sameList(cats, legacyDefaults[l])) {
          const list = legacyDefaults[l];
          mapCat = c => { const i = list.indexOf(c); return i >= 0 ? CANON[legacyMap[i]] : c; };
          cats = [...CANON];
        }
      }
      const id = newId('t');
      const list = old.filter(e => e && e.date).map(e => {
        const fund = e.type === 'income' || e.type === 'fund';
        return { id: e.id || newId('e'), date: String(e.date), type: fund ? 'fund' : 'expense', category: fund ? '' : mapCat(String(e.category || '')), place: String(e.place || ''), amount: String(e.amount || '0').replace(/[^0-9]/g, '') || '0', memo: String(e.memo || ''), by: 'admin' };
      });
      if (!list.length) return;
      const dates = list.map(e => e.date).sort();
      const tour = { id, name: '이전 기록', guide: '-', startDate: dates[0], endDate: dates[dates.length - 1], status: 'open', fundTotal: 0, spendTotal: 0, entryCount: 0, createdAt: new Date().toISOString() };
      list.forEach(e => delta(tour, e, 1));
      data.tours.push(tour);
      data.entries[id] = list;
      const places = Store.get('myPlaces', []);
      const presets = Store.get('myPresets', null);
      data.config = {
        categories: cats || [...CANON],
        places: Array.isArray(places) ? places.map(p => ({ ...p, category: mapCat(String(p.category || '')) })) : [],
        presets: Array.isArray(presets) ? presets.map(p => ({ ...p, category: mapCat(String(p.category || '')) })) : null
      };
    }

    if (!data || !Array.isArray(data.tours)) {
      data = { tours: [], entries: {}, config: null };
      migrateLegacy();
      Store.set(KEY, data);
    }

    return {
      mode: 'local',
      async init() {},
      isAdmin() { return true; },
      async ensureGuideAuth() {},
      async login() {}, async logout() {},
      onError() {},
      watchConfig: cb => sub('config', null, cb),
      saveConfig(cfg) { data.config = clone(cfg); persist(); },
      watchTours: cb => sub('tours', null, cb),
      createTour(t) {
        const id = newId('t');
        data.tours.push({ id, ...clone(t), status: 'open', fundTotal: 0, spendTotal: 0, entryCount: 0, createdAt: new Date().toISOString() });
        data.entries[id] = [];
        persist();
        return id;
      },
      updateTour(id, patch) { const t = findTour(id); if (t) { Object.assign(t, clone(patch)); persist(); } },
      async removeTour(id) { data.tours = data.tours.filter(x => x.id !== id); delete data.entries[id]; persist(); },
      watchTour: (id, cb) => sub('tour', id, cb),
      watchEntries: (id, cb) => sub('entries', id, cb),
      addEntry(tid, e) {
        const t = findTour(tid); if (!t) return;
        (data.entries[tid] = data.entries[tid] || []).push(clone(e));
        delta(t, e, 1); persist();
        return e.id;
      },
      saveEntry(tid, oldE, newE) {
        const t = findTour(tid), list = data.entries[tid] || [];
        const i = list.findIndex(x => x.id === newE.id);
        if (!t || i < 0) return;
        delta(t, list[i], -1); list[i] = clone(newE); delta(t, newE, 1); persist();
      },
      removeEntry(tid, e) {
        const t = findTour(tid), list = data.entries[tid] || [];
        const i = list.findIndex(x => x.id === e.id);
        if (!t || i < 0) return;
        delta(t, list[i], -1); list.splice(i, 1); persist();
      },
      async dumpAll() { return { tours: data.tours.map(t => ({ ...clone(t), entries: clone(data.entries[t.id] || []) })), config: data.config ? clone(data.config) : null }; },
      async importAll(d) {
        data = { tours: [], entries: {}, config: d.config ? clone(d.config) : null };
        d.tours.forEach(t => {
          const { entries, ...rest } = t;
          const tour = { ...rest, id: rest.id || newId('t'), fundTotal: 0, spendTotal: 0, entryCount: 0 };
          const list = (entries || []).map(e => ({ ...e, id: e.id || newId('e'), type: e.type === 'income' ? 'fund' : e.type }));
          list.forEach(e => delta(tour, e, 1));
          data.tours.push(tour); data.entries[tour.id] = list;
        });
        persist();
      },
      async resetAll() { data = { tours: [], entries: {}, config: null }; persist(); }
    };
  })();

  /* =====================================================
     데이터 계층 ② Firebase (Auth + Firestore)
     - 관리자: 이메일/비밀번호 로그인
     - 가이드: 링크로 들어오면 익명 로그인 (투어 ID가 곧 입장권)
     ===================================================== */
  const FireDB = (function () {
    let app, auth, db, A, F;
    let errCb = () => {};
    const guard = p => { Promise.resolve(p).catch(e => { console.error(e); errCb(e); }); };
    const clean = o => JSON.parse(JSON.stringify(o));
    const errMeta = e => ({ error: (e && e.code) || 'error' });
    // 앱 안 브라우저/사생활 보호 모드처럼 IndexedDB를 못 쓰는 환경에서는 오프라인 저장 없이 동작
    const idbOk = () => new Promise(res => {
      try {
        const r = indexedDB.open('__probe__');
        r.onsuccess = () => { try { r.result.close(); indexedDB.deleteDatabase('__probe__'); } catch (e) {} res(true); };
        r.onerror = () => res(false);
        r.onblocked = () => res(false);
        setTimeout(() => res(false), 1500);
      } catch (e) { res(false); }
    });

    function tourDelta(oldE, newE) {
      let fund = 0, spend = 0, count = 0;
      if (oldE) { const a = amt(oldE); if (oldE.type === 'fund') fund -= a; else spend -= a; count--; }
      if (newE) { const a = amt(newE); if (newE.type === 'fund') fund += a; else spend += a; count++; }
      const o = { updatedAt: new Date().toISOString() };
      if (fund) o.fundTotal = F.increment(fund);
      if (spend) o.spendTotal = F.increment(spend);
      if (count) o.entryCount = F.increment(count);
      return o;
    }

    return {
      mode: 'firebase',
      async init() {
        const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
        const mods = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
        A = mods[1]; F = mods[2];
        app = mods[0].initializeApp(firebaseConfig);
        auth = A.getAuth(app);
        if (await idbOk()) {
          try {
            // 오프라인에서도 입력 가능 (연결되면 자동 동기화)
            db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
          } catch (e) { db = F.getFirestore(app); }
        } else {
          db = F.getFirestore(app);
        }
        await new Promise(res => { let un; un = A.onAuthStateChanged(auth, () => { if (un) un(); res(); }); });
      },
      isAdmin() { return !!auth.currentUser && !auth.currentUser.isAnonymous; },
      async ensureGuideAuth() { if (!auth.currentUser) await A.signInAnonymously(auth); },
      login(email, pw) { return A.signInWithEmailAndPassword(auth, email, pw); },
      logout() { return A.signOut(auth); },
      onError(fn) { errCb = fn; },

      watchConfig(cb) {
        return F.onSnapshot(F.doc(db, 'config', 'main'), s => cb(s.exists() ? s.data() : null, { fromCache: s.metadata.fromCache }), e => { console.error(e); cb(null, errMeta(e)); });
      },
      saveConfig(cfg) { guard(F.setDoc(F.doc(db, 'config', 'main'), clean(cfg))); },

      watchTours(cb) {
        const q = F.query(F.collection(db, 'tours'), F.orderBy('startDate', 'desc'));
        return F.onSnapshot(q, s => cb(s.docs.map(d => ({ id: d.id, ...d.data() })), { fromCache: s.metadata.fromCache }), e => { console.error(e); cb([], errMeta(e)); });
      },
      createTour(t) {
        const ref = F.doc(F.collection(db, 'tours'));
        guard(F.setDoc(ref, { ...clean(t), status: 'open', fundTotal: 0, spendTotal: 0, entryCount: 0, createdAt: new Date().toISOString() }));
        return ref.id;
      },
      updateTour(id, patch) { guard(F.updateDoc(F.doc(db, 'tours', id), clean(patch))); },
      async removeTour(id) {
        const snap = await F.getDocs(F.collection(db, 'tours', id, 'entries'));
        for (let i = 0; i < snap.docs.length; i += 400) {
          const b = F.writeBatch(db);
          snap.docs.slice(i, i + 400).forEach(d => b.delete(d.ref));
          await b.commit();
        }
        await F.deleteDoc(F.doc(db, 'tours', id));
      },
      watchTour(id, cb) {
        return F.onSnapshot(F.doc(db, 'tours', id), s => {
          if (!s.exists() && s.metadata.fromCache) return;   // 오프라인 캐시에 아직 없을 뿐일 수 있음
          cb(s.exists() ? { id: s.id, ...s.data() } : null, { fromCache: s.metadata.fromCache });
        }, e => { console.error(e); cb(null, errMeta(e)); });
      },
      watchEntries(id, cb) {
        return F.onSnapshot(F.collection(db, 'tours', id, 'entries'), s => cb(s.docs.map(d => ({ id: d.id, ...d.data() })), { fromCache: s.metadata.fromCache }), e => { console.error(e); cb([], errMeta(e)); });
      },
      addEntry(tid, e) {
        const b = F.writeBatch(db);
        b.set(F.doc(db, 'tours', tid, 'entries', e.id), clean(e));
        b.update(F.doc(db, 'tours', tid), tourDelta(null, e));
        guard(b.commit());
        return e.id;
      },
      saveEntry(tid, oldE, newE) {
        const b = F.writeBatch(db);
        b.set(F.doc(db, 'tours', tid, 'entries', newE.id), clean(newE));
        b.update(F.doc(db, 'tours', tid), tourDelta(oldE, newE));
        guard(b.commit());
      },
      removeEntry(tid, e) {
        const b = F.writeBatch(db);
        b.delete(F.doc(db, 'tours', tid, 'entries', e.id));
        b.update(F.doc(db, 'tours', tid), tourDelta(e, null));
        guard(b.commit());
      },
      async dumpAll() {
        const ts = await F.getDocs(F.collection(db, 'tours'));
        const tours = [];
        for (const d of ts.docs) {
          const es = await F.getDocs(F.collection(db, 'tours', d.id, 'entries'));
          tours.push({ id: d.id, ...d.data(), entries: es.docs.map(x => ({ id: x.id, ...x.data() })) });
        }
        const c = await F.getDoc(F.doc(db, 'config', 'main'));
        return { tours, config: c.exists() ? c.data() : null };
      }
    };
  })();

  const DB = USE_FIREBASE ? FireDB : LocalDB;

  /* =====================================================
     상태
     ===================================================== */
  let lang = localStorage.getItem('myLang');
  if (!translations[lang]) lang = 'ko';
  const T = () => translations[lang];

  let role = 'admin';               // 'admin' | 'guide'
  let config = normalizeConfig(null);
  let tours = [];
  let curTourId = null, curTour = null, curEntries = [], entriesFromCache = false, tourMissing = false;
  let unsubConfig = null, unsubTours = null, unsubTour = null, unsubEntries = null, healTimer = null;

  let view = 'boot';
  let bdMode = 'cat';
  let statusFilter = 'open';
  let guideFilter = '';
  let editingId = null;
  let draft = { type: 'expense', category: '', place: '', date: '' };
  let editTourId = null;
  let editCatIndex = null;
  let curVendorId = null;
  let editItemId = null, itemQtyMode = 'pax', itemUnit = 1000;
  let draftVendor = { category: '' };

  // 설정 형식: { categories: [...], vendors: [{ id, name, category, items: [{ id, name, price, qtyMode }] }] }
  // (예전 형식인 places + presets 는 읽을 때 vendors 로 자동 변환)
  function normalizeConfig(c) {
    const cats = c && Array.isArray(c.categories) && c.categories.length ? c.categories.map(String) : [...CANON];
    const normItem = m => ({ id: m.id || newId('m'), name: String(m.name), price: m.price ? String(m.price) : '', qtyMode: m.qtyMode === 'pax' ? 'pax' : '1' });
    let vendors = [];
    if (c && Array.isArray(c.vendors)) {
      vendors = c.vendors.filter(v => v && v.name).map(v => ({ id: v.id || newId('v'), name: String(v.name), category: String(v.category || ''), items: (Array.isArray(v.items) ? v.items : []).filter(m => m && m.name).map(normItem) }));
    } else if (c) {
      (Array.isArray(c.places) ? c.places : []).filter(p => p && p.name).forEach(p => vendors.push({ id: p.id || newId('v'), name: String(p.name), category: String(p.category || ''), items: [] }));
      (Array.isArray(c.presets) ? c.presets : []).filter(p => p && p.name).forEach(p => {
        const cat = String(p.category || '');
        let v = p.place ? (vendors.find(x => x.name === p.place && x.category === cat) || vendors.find(x => x.name === p.place)) : vendors.find(x => x.name === (cat || '기타'));
        if (!v) { v = { id: newId('v'), name: p.place ? String(p.place) : (cat || '기타'), category: cat, items: [] }; vendors.push(v); }
        v.items.push(normItem({ name: p.name, price: p.amount, qtyMode: p.qtyMode }));
      });
    }
    return { categories: cats, vendors };
  }
  function commitConfig() { DB.saveConfig(config); renderAll(); }

  // 금액 입력 단위는 '기기마다' 따로 (저장되는 금액은 항상 원). 기본값: 관리자=원, 가이드=천 동(가이드 양식과 같음)
  const unitOf = () => { const v = localStorage.getItem('myUnit'); return v === '1' ? 1 : v === '1000' ? 1000 : (role === 'guide' ? 1000 : 1); };
  const normEntry = e => {
    const amount = Number(e.amount) || 0;
    const qty = Math.max(1, parseInt(e.qty, 10) || 1);
    const unitPrice = Number(e.unitPrice) > 0 ? Number(e.unitPrice) : (qty > 1 ? amount / qty : amount);   // 예전 내역(금액만 있던 것) 호환
    return { ...e, type: (e.type === 'fund' || e.type === 'income') ? 'fund' : 'expense', category: String(e.category || ''), place: String(e.place || ''), amount: String(amount), unitPrice: String(unitPrice), qty, memo: String(e.memo || '') };
  };

  /* ---------- 카테고리 표시 (보는 사람 언어로 번역) ---------- */
  function catLabel(name) {
    if (!name) return T().uncategorized;
    for (const l in defaultCategories) {
      const i = defaultCategories[l].indexOf(name);
      if (i >= 0) return defaultCategories[lang][i];
    }
    return name;
  }
  function iconFor(name) {
    for (const l in defaultCategories) {
      const i = defaultCategories[l].indexOf(name);
      if (i >= 0) return CAT_ICONS[i];
    }
    return '🏷️';
  }
  const catOrder = c => { const i = config.categories.indexOf(c); return i < 0 ? 999 : i; };
  const vendorList = () => [...config.vendors].sort((a, b) => catOrder(a.category) - catOrder(b.category) || a.name.localeCompare(b.name));
  const findVendor = (name, category) => config.vendors.find(v => v.name === name && v.category === category) || config.vendors.find(v => v.name === name);
  const curVendor = () => config.vendors.find(v => v.id === curVendorId);

  function dateLabel(str) {
    return parseD(str).toLocaleDateString(LOCALES[lang], { month: 'short', day: 'numeric', weekday: 'short' });
  }
  function fmtInput(inp) {
    const v = inp.value.replace(/[^0-9]/g, '').slice(0, 13);
    inp.value = v ? Number(v).toLocaleString('en-US') : '';
  }

  /* ---------- 계산 ---------- */
  function sumEntries(list) {
    const r = { funds: 0, spent: 0, byCat: {}, byPlace: {} };
    list.forEach(e => {
      const a = amt(e);
      if (e.type === 'fund') { r.funds += a; return; }
      r.spent += a;
      r.byCat[e.category] = (r.byCat[e.category] || 0) + a;
      if (e.place) { const k = e.category + '\u0001' + e.place; r.byPlace[k] = (r.byPlace[k] || 0) + a; }
    });
    return r;
  }
  // 잔액 > 0 : 가이드가 돌려줄 돈 / 잔액 < 0 : 내가 줘야 할 돈
  function resultInfo(bal) {
    const t = T(), admin = role === 'admin';
    if (bal > 0) return { label: t.resultReturn, xl: t.xlResultReturn };
    if (bal < 0) return { label: t.resultOwe, xl: t.xlResultOwe };
    return { label: t.resultEven, xl: t.xlResultEven };
  }
  // 연결 오류를 사람이 이해할 수 있는 안내로 바꿔줌
  function explainError(e) {
    const t = T();
    const code = String((e && (e.code || e.name)) || 'error');
    let hint = '';
    if (/operation-not-allowed|admin-restricted/.test(code)) hint = t.errAnonOff;
    else if (/unauthorized-domain/.test(code)) hint = fill(t.errDomain, { host: location.hostname || 'localhost' });
    else if (/permission-denied|insufficient-permissions/.test(code)) hint = t.errRules;
    else if (/network|unavailable|timeout|offline/.test(code)) hint = t.errNetwork;
    else if (/api-key|app-not-authorized|invalid-app|configuration|project/.test(code)) hint = t.errConfig;
    else hint = t.errBrowser;
    return { code, hint };
  }
  function problemText(meta) {
    if (meta && meta.error) { const x = explainError({ code: meta.error }); return x.hint + '\n[' + x.code + ']'; }
    if (DB.mode === 'local') return T().errDemo;
    return '';
  }
  const tourBalance = tr => (tr.fundTotal || 0) - (tr.spendTotal || 0);
  const nightsText = tr => `${mdText(tr.startDate)}–${mdText(tr.endDate)}`;

  /* =====================================================
     공통 UI: 토스트, 다이얼로그, 시트, 칩
     ===================================================== */
  let toastTimer = null;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
  }
  function askConfirm(msg, okLabel) {
    return new Promise(resolve => {
      const t = T();
      $('dlgMsg').textContent = msg;
      $('dlgOk').textContent = okLabel || t.confirmOk;
      $('dlgCancel').textContent = t.cancel;
      $('dialog').classList.add('open');
      const done = v => { $('dialog').classList.remove('open'); $('dlgOk').onclick = null; $('dlgCancel').onclick = null; resolve(v); };
      $('dlgOk').onclick = () => done(true);
      $('dlgCancel').onclick = () => done(false);
    });
  }
  let openSheetId = null;
  function openSheet(id) {
    if (openSheetId) $(openSheetId).classList.remove('open');
    openSheetId = id;
    $(id).classList.add('open');
    $('backdrop').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeSheet() {
    if (!openSheetId) return;
    $(openSheetId).classList.remove('open');
    openSheetId = null;
    $('backdrop').classList.remove('open');
    document.body.style.overflow = '';
  }
  const chipsHTML = (items, selected) => items.map(i =>
    `<button type="button" class="chip${i.cls ? ' ' + i.cls : ''}${i.value === selected ? ' on' : ''}" data-v="${esc(i.value)}">${i.icon ? `<span>${i.icon}</span>` : ''}${esc(i.label)}</button>`).join('');
  function bindChips(el, handler) { el.onclick = ev => { const b = ev.target.closest('.chip'); if (b) handler(b.dataset.v); }; }
  function setSeg(el, value) { el.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === value)); }
  function bindSeg(el, handler) { el.onclick = ev => { const b = ev.target.closest('button'); if (b) { setSeg(el, b.dataset.v); handler(b.dataset.v); } }; }

  /* =====================================================
     번역 적용 / 내비게이션
     ===================================================== */
  function applyI18n() {
    const t = T();
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n]; });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t[el.dataset.i18nPh]; });
    document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t[el.dataset.i18nAria]); });
    document.title = t.appTitle;
    setSeg($('langSeg'), lang);
  }

  const VIEWS = {
    boot: { title: 'appTitle', root: 'tours' },
    login: { title: 'loginTitle', root: 'tours' },
    tours: { title: 'toursTitle', root: 'tours' },
    tour: { title: null, root: 'tours' },
    notfound: { title: 'tourNotFound', root: 'tours' },
    settings: { title: 'tabSettings', root: 'settings' },
    cats: { title: 'manageCats', root: 'settings' },
    places: { title: 'managePlaces', root: 'settings' },
    vendor: { title: null, root: 'settings' },
    data: { title: 'manageData', root: 'settings' }
  };
  function backTarget(v) {
    if (v === 'tour') return role === 'admin' ? 'tours' : null;
    if (v === 'vendor') return 'places';
    if (['cats', 'places', 'data'].includes(v)) return 'settings';
    return null;
  }
  const canAddEntry = () => !!curTour && curTour.status !== 'settled';   // 사장님/가이드 동일

  function go(v) {
    view = v;
    closeSheet();
    document.querySelectorAll('.view').forEach(s => s.classList.toggle('hidden', s.id !== 'view-' + v));
    window.scrollTo(0, 0);
    renderAll();
  }
  function applyChrome() {
    const t = T(), cfg = VIEWS[view];
    $('topTitle').textContent = view === 'tour' ? (curTour ? curTour.name : t.loading) : view === 'vendor' ? ((curVendor() || {}).name || '') : t[cfg.title];
    $('backBtn').classList.toggle('hidden', !backTarget(view));
    $('moreBtn').classList.toggle('hidden', !(view === 'tour' && curTour));
    $('langBtn').classList.toggle('hidden', !(role === 'guide' && view !== 'boot'));
    $('langBtnText').textContent = lang.toUpperCase();
    $('tabbar').classList.toggle('hidden', view === 'boot' || view === 'login');
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.go === cfg.root));
    $('demoBanner').classList.toggle('hidden', !(DB.mode === 'local' && role === 'admin' && view !== 'boot'));
    const showFab = (view === 'tours' && role === 'admin') || (view === 'tour' && !!curTour && canAddEntry());
    $('fab').classList.toggle('hidden', !showFab);
    $('fabText').textContent = view === 'tours' ? t.newTourBtn : t.addEntryBtn;
  }

  /* =====================================================
     렌더링: 공통 행
     ===================================================== */
  function entryRow(e) {
    const t = T();
    const fund = e.type === 'fund';
    const editable = !!curTour && curTour.status !== 'settled';
    const parts = [];
    if (!fund) {
      if (e.category) parts.push(esc(catLabel(e.category)));
      if (e.place) parts.push(esc(e.place));
      if ((e.qty || 1) > 1) parts.push(`${fmt(e.unitPrice)} × ${e.qty}`);
    }
    const sub = fund ? t.fundBadgeAdmin : parts.join(' · ');
    return `<button class="row${editable ? '' : ' static'}" ${editable ? `data-id="${esc(e.id)}"` : 'tabindex="-1"'}>
      <span class="ico${fund ? ' inc' : ''}">${fund ? '💰' : iconFor(e.category)}</span>
      <span class="row-main"><span class="row-title">${esc(e.memo)}</span><span class="row-sub">${sub}</span></span>
      <span class="row-amt num ${fund ? 'income' : 'expense'}">${fund ? '+' : '−'}${fmt(e.amount)}</span>
    </button>`;
  }
  const emptyHTML = (title, hint) => `<div class="empty"><b>${esc(title)}</b>${hint ? `<span style="white-space:pre-line">${esc(hint)}</span>` : ''}</div>`;

  /* =====================================================
     렌더링: 투어 목록 (관리자)
     ===================================================== */
  function renderTours() {
    const t = T();
    const open = tours.filter(x => x.status !== 'settled');
    let recv = 0, pay = 0;
    open.forEach(x => { const b = tourBalance(x); if (b > 0) recv += b; else pay += -b; });
    $('sumReceive').textContent = fmt(recv);
    $('sumPay').textContent = fmt(pay);
    $('pendingCount').textContent = fill(t.pendingCount, { n: open.length });

    const guides = [...new Set(tours.map(x => x.guide).filter(Boolean))].sort((a, b) => a.localeCompare(b));
    if (guideFilter && !guides.includes(guideFilter)) guideFilter = '';
    $('guideChips').parentElement.classList.toggle('hidden', guides.length < 2);
    $('guideChips').innerHTML = chipsHTML([{ value: '', label: t.allGuides }, ...guides.map(g => ({ value: g, label: g }))], guideFilter);
    setSeg($('statusSeg'), statusFilter);

    const list = tours.filter(x => (statusFilter === 'open' ? x.status !== 'settled' : x.status === 'settled') && (!guideFilter || x.guide === guideFilter));
    if (list.length === 0) {
      $('tourList').innerHTML = `<div class="surface">${emptyHTML(statusFilter === 'open' ? t.noTours : t.noToursSettled, statusFilter === 'open' ? t.noToursHint : '')}</div>`;
      return;
    }
    $('tourList').innerHTML = `<div class="rows">${list.map(x => {
      const b = tourBalance(x);
      const cls = b > 0 ? 'income' : b < 0 ? 'expense' : '';
      const sign = b > 0 ? '+' : b < 0 ? '−' : '';
      const lbl = b > 0 ? t.recvLabel : b < 0 ? t.payLabel : t.evenLabel;
      return `<button class="row" data-id="${esc(x.id)}">
        <span class="ico">🧳</span>
        <span class="row-main"><span class="row-title">${esc(x.name)}</span><span class="row-sub">${esc(x.guide || '')} · ${esc(nightsText(x))}</span></span>
        <span class="row-right"><span class="row-amt num ${cls}">${sign}${fmt(Math.abs(b))}</span><span class="row-sub">${lbl}</span></span>
      </button>`;
    }).join('')}</div>`;
  }

  /* =====================================================
     렌더링: 투어 상세
     ===================================================== */
  function dayHeader(tr, date) {
    const t = T();
    if (tr && tr.startDate) {
      const n = diffDays(tr.startDate, date) + 1;
      if (n >= 1 && n <= 14) return `${fill(t.dayLabel, { n })} · ${dateLabel(date)}`;
    }
    return dateLabel(date);
  }
  function renderTour() {
    const t = T();
    const admin = role === 'admin';
    const tr = curTour;
    const sm = sumEntries(curEntries);
    const bal = sm.funds - sm.spent;
    const info = resultInfo(bal);
    const settled = !!tr && tr.status === 'settled';

    $('tourMeta').textContent = tr ? `${tr.guide || ''} · ${nightsText(tr)}${tr.pax ? ' · ' + fill(t.paxUnit, { n: tr.pax }) : ''}` : '';
    const st = $('tourStatus');
    st.textContent = tr ? (settled ? t.statusSettled : t.statusOpen) : '';
    st.classList.toggle('done', settled);
    $('resultLabel').textContent = (settled ? t.settledPrefix : '') + info.label;
    $('tourBalanceNum').textContent = fmt(Math.abs(bal));
    $('tourBalance').style.fontSize = fmt(Math.abs(bal)).length >= 12 ? '30px' : '';   // 아주 큰 숫자는 카드 안에 맞춤
    $('tourBalance').classList.toggle('neg', bal < 0);
    $('tourFunds').textContent = fmt(sm.funds);
    $('tourSpent').textContent = fmt(sm.spent);
    $('lblFunds').textContent = t.fundGiven;

    const fillEl = $('tourBarFill');
    if (sm.funds > 0) {
      const pct = Math.round(sm.spent / sm.funds * 100);
      fillEl.style.width = Math.min(100, pct) + '%';
      fillEl.classList.toggle('over', sm.spent > sm.funds);
      $('tourBarText').textContent = sm.spent > sm.funds ? t.envOver : t.envUsed;
      $('tourBarPct').textContent = pct + '%';
    } else {
      fillEl.style.width = '0%';
      fillEl.classList.remove('over');
      $('tourBarText').textContent = t.envNoFund;
      $('tourBarPct').textContent = '';
    }

    const notice = $('tourNotice');
    notice.classList.toggle('hidden', !settled);
    notice.textContent = t.settledBanner;

    $('tourActions').classList.toggle('hidden', !tr);
    $('settleBtn').textContent = settled ? t.reopenBtn : t.settleBtn;
    $('settleBtn').className = 'btn block ' + (settled ? 'ghost' : 'primary');

    // 지출 분석
    setSeg($('bdSeg'), bdMode);
    let rows;
    if (bdMode === 'cat') rows = Object.entries(sm.byCat).map(([k, v]) => ({ name: catLabel(k), icon: iconFor(k), v })).sort((a, b) => b.v - a.v);
    else rows = Object.entries(sm.byPlace).map(([k, v]) => { const [c, p] = k.split('\u0001'); return { name: p, small: catLabel(c), icon: iconFor(c), v }; }).sort((a, b) => b.v - a.v);
    rows = rows.slice(0, 8);
    $('breakdownList').innerHTML = rows.length === 0
      ? `<div class="empty" style="padding:18px 0;">${esc(bdMode === 'place' && sm.spent > 0 ? t.noPlaceData : t.noExpenseData)}</div>`
      : rows.map((r, i) => {
          const pct = sm.spent ? Math.round(r.v / sm.spent * 100) : 0;
          return `<div class="bd-row">
            <div class="bd-top"><span class="bd-name">${r.icon} ${esc(r.name)}${r.small ? `<small>${esc(r.small)}</small>` : ''}</span><span class="bd-val num">${fmt(r.v)}<em>${pct}%</em></span></div>
            <div class="bar"><i style="width:${Math.max(pct, 2)}%;background:${BAR_COLORS[i % BAR_COLORS.length]}"></i></div>
          </div>`;
        }).join('');

    // 내역 (날짜별)
    const list = curEntries.map((e, idx) => ({ ...e, idx })).sort((a, b) => b.date.localeCompare(a.date) || b.idx - a.idx);
    if (list.length === 0) {
      $('tourEntries').innerHTML = `<div class="surface">${emptyHTML(t.emptyTitle, canAddEntry() ? t.emptyHint : '')}</div>`;
      return;
    }
    const groups = [];
    list.forEach(e => {
      let g = groups[groups.length - 1];
      if (!g || g.date !== e.date) { g = { date: e.date, items: [] }; groups.push(g); }
      g.items.push(e);
    });
    $('tourEntries').innerHTML = groups.map(g => {
      const spent = g.items.filter(e => e.type === 'expense').reduce((s, e) => s + amt(e), 0);
      return `<div class="day-group">
        <div class="day-head"><span>${esc(dayHeader(tr, g.date))}</span><span class="num">${spent ? `${t.spent} ${fmt(spent)}` : ''}</span></div>
        <div class="rows">${g.items.map(entryRow).join('')}</div>
      </div>`;
    }).join('');
  }

  /* =====================================================
     렌더링: 설정 / 하위 화면
     ===================================================== */
  function renderSettings() {
    const admin = role === 'admin';
    $('adminMenu').classList.toggle('hidden', !admin);
    $('guideMenu').classList.toggle('hidden', admin);
    $('logoutBtn').classList.toggle('hidden', !(admin && DB.mode === 'firebase'));
    setSeg($('langSeg'), lang);
    setSeg($('unitSeg'), String(unitOf()));
  }
  function renderCats() {
    $('catList').innerHTML = `<div class="rows">${config.categories.map((c, i) =>
      `<button class="row" data-i="${i}"><span class="ico">${iconFor(c)}</span><span class="row-main"><span class="row-title">${esc(catLabel(c))}</span></span><span class="row-chev">›</span></button>`).join('')}</div>`;
  }

  function renderPlaces() {
    const t = T();
    const list = vendorList();
    if (list.length === 0) { $('placeList').innerHTML = `<div class="surface" style="margin-top:12px;">${emptyHTML(t.emptyPlaces, '')}</div>`; return; }
    const cats = [...new Set(list.map(v => v.category))];
    $('placeList').innerHTML = cats.map(c => `
      <div class="group-label">${iconFor(c)} ${esc(catLabel(c))}</div>
      <div class="rows">${list.filter(v => v.category === c).map(v => `
        <button class="row" data-id="${esc(v.id)}"><span class="ico">${iconFor(v.category)}</span><span class="row-main"><span class="row-title">${esc(v.name)}</span><span class="row-sub">${esc(fill(t.itemsCount, { n: v.items.length }))}</span></span><span class="row-chev">›</span></button>`).join('')}</div>`).join('');
  }
  function renderVendor() {
    const t = T();
    const v = curVendor();
    if (!v) { go('places'); return; }
    $('vendorHead').innerHTML = `<span class="ico">${iconFor(v.category)}</span><span class="row-main"><b>${esc(v.name)}</b><span class="row-sub">${esc(catLabel(v.category))}</span></span>`;
    $('itemList').innerHTML = v.items.length === 0
      ? `<div class="surface">${emptyHTML(t.itemEmpty, '')}</div>`
      : `<div class="rows">${v.items.map(m => `
        <button class="row" data-id="${esc(m.id)}"><span class="ico">📋</span>
          <span class="row-main"><span class="row-title">${esc(m.name)}</span><span class="row-sub">${m.qtyMode === 'pax' ? '× ' + esc(t.presetQtyPax) : ''}</span></span>
          <span class="row-amt num">${m.price ? fmt(m.price) : '—'}</span></button>`).join('')}</div>`;
  }
  function renderData() {
    const local = DB.mode === 'local';
    $('dataRestore').classList.toggle('hidden', !local);
    $('dataReset').classList.toggle('hidden', !local);
    $('dataNote').textContent = local ? T().dataNoteLocal : T().dataNoteCloud;
  }

  function renderAll() {
    applyChrome();
    switch (view) {
      case 'tours': renderTours(); break;
      case 'tour': renderTour(); break;
      case 'settings': renderSettings(); break;
      case 'cats': renderCats(); break;
      case 'places': renderPlaces(); break;
      case 'vendor': renderVendor(); break;
      case 'data': renderData(); break;
    }
  }

  /* =====================================================
     투어 열기 / 닫기
     ===================================================== */
  function stopTourWatch() {
    if (unsubTour) { unsubTour(); unsubTour = null; }
    if (unsubEntries) { unsubEntries(); unsubEntries = null; }
    clearTimeout(healTimer);
    curTourId = null; curTour = null; curEntries = []; tourMissing = false;
  }
  function openTour(id) {
    stopTourWatch();
    curTourId = id;
    unsubTour = DB.watchTour(id, (tr, meta) => {
      curTour = tr;
      if (!tr) {
        if (role === 'guide') { tourMissing = true; $('nfDetail').textContent = problemText(meta); if (view !== 'settings') go('notfound'); }
        else if (view === 'tour') { stopTourWatch(); go('tours'); }
        return;
      }
      tourMissing = false;
      if (role === 'guide' && tr.guideLang && translations[tr.guideLang] && !localStorage.getItem('myLang') && lang !== tr.guideLang) { lang = tr.guideLang; applyI18n(); }
      if (view === 'notfound') go('tour'); else renderAll();
    });
    unsubEntries = DB.watchEntries(id, (list, meta) => {
      if (meta && meta.error) toast(T().errLoad + ' [' + meta.error + ']');
      curEntries = list.map(normEntry);
      entriesFromCache = !!(meta && meta.fromCache);
      scheduleHeal();
      renderAll();
    });
    go('tour');
  }
  // 관리자 화면에서 투어 문서의 합계를 실제 내역과 맞춰둠 (가이드/관리자가 동시에 입력해도 오차가 쌓이지 않게)
  function scheduleHeal() {
    if (role !== 'admin') return;
    clearTimeout(healTimer);
    healTimer = setTimeout(() => {
      if (!curTour || !curTourId || entriesFromCache) return;
      const sm = sumEntries(curEntries);
      if ((curTour.fundTotal || 0) !== sm.funds || (curTour.spendTotal || 0) !== sm.spent || (curTour.entryCount || 0) !== curEntries.length) {
        DB.updateTour(curTourId, { fundTotal: sm.funds, spendTotal: sm.spent, entryCount: curEntries.length });
      }
    }, 1200);
  }
  const linkFor = (id, l) => location.href.split(/[?#]/)[0] + '?t=' + encodeURIComponent(id) + (l ? '&l=' + l : '');

  /* =====================================================
     시트: 내역 추가/수정
     ===================================================== */
  /* ---------- 단가 × 수량 입력 ---------- */
  let sheetUnit = 1000;   // 이 시트에서 쓰는 입력 단위 (기존 내역이 단위로 안 나눠떨어지면 1로 바뀜)
  const readPrice = () => (Number($('entryAmount').value.replace(/[^0-9]/g, '')) || 0) * sheetUnit;
  const readQty = () => Math.max(1, parseInt($('entryQty').value.replace(/[^0-9]/g, ''), 10) || 1);
  const curPax = () => (curTour && Number(curTour.pax) > 0 ? Number(curTour.pax) : 0);
  function updateTotals() {
    const t = T();
    const isFund = draft.type === 'fund';
    const p = readPrice(), q = isFund ? 1 : readQty();
    $('pricePreview').textContent = p && sheetUnit !== 1 ? `= ${fmt(p)} ${t.currency}` : '';
    $('totalVal').textContent = `${fmt(p * q)} ${t.currency}`;
    $('totalRow').classList.toggle('hidden', isFund || q <= 1);
    const pax = curPax();
    $('paxBtn').classList.toggle('on', !!pax && q === pax);
  }

  const vendorFor = d => (d.vendorId ? config.vendors.find(v => v.id === d.vendorId) : null);
  function openEntrySheet(id, type) {
    if (!curTour) return;
    editingId = id || null;
    sheetUnit = unitOf();
    if (id) {
      const e = curEntries.find(x => x.id === id);
      if (!e) return;
      const v = e.place ? findVendor(e.place, e.category) : null;
      draft = { type: e.type, category: e.category, place: e.place || '', vendorId: v ? v.id : '', itemId: '', date: e.date };
      const up = Number(e.unitPrice) || 0;
      if (up % sheetUnit !== 0) sheetUnit = 1;
      $('entryAmount').value = up ? fmt(up / sheetUnit) : '';
      $('entryQty').value = String(e.qty || 1);
      $('entryMemo').value = e.memo;
    } else {
      draft = { type: type || 'expense', category: '', place: '', vendorId: '', itemId: '', date: todayStr() };
      $('entryAmount').value = '';
      $('entryQty').value = '1';
      $('entryMemo').value = '';
    }
    $('entryDate').value = draft.date;
    renderEntrySheet();
    openSheet('entrySheet');
    if (!id) setTimeout(() => $('entryAmount').focus(), 280);
  }
  function renderEntrySheet() {
    const t = T();
    const isFund = draft.type === 'fund';
    const editing = !!editingId;
    $('entryTitle').textContent = editing ? t.editEntry : (isFund ? t.newFund : t.newEntry);
    setSeg($('entryTypeSeg'), draft.type);

    $('priceLabel').textContent = isFund ? t.amountLabel : t.unitPriceLabel;
    $('unitSuffix').textContent = sheetUnit === 1000 ? t.unitSuffixK : t.currency;
    $('qtyField').classList.toggle('hidden', isFund);
    const pax = curPax();
    $('paxBtn').classList.toggle('hidden', !pax);
    $('paxBtn').textContent = fill(t.paxBtn, { n: pax });

    // 업체 → 메뉴
    const vendors = vendorList();
    const orphan = !!draft.place && !draft.vendorId;   // 삭제된 업체의 기존 내역을 수정할 때
    const vitems = vendors.map(v => ({ value: v.id, label: v.name, icon: iconFor(v.category) }));
    if (orphan) vitems.push({ value: '__orphan', label: draft.place, icon: iconFor(draft.category) });
    $('vendorField').classList.toggle('hidden', isFund || vitems.length === 0);
    $('vendorChips').innerHTML = chipsHTML(vitems, draft.vendorId || (orphan ? '__orphan' : ''));
    const v = vendorFor(draft);
    const items = v ? v.items : [];
    $('menuField').classList.toggle('hidden', isFund || items.length === 0);
    $('menuChips').innerHTML = chipsHTML(items.map(m => ({ value: m.id, label: m.name + (m.price ? ' · ' + fmt(m.price) : ''), cls: 'quick' })), draft.itemId);

    // 업체 없이 입력할 때만 카테고리를 직접 고름
    $('catField').classList.toggle('hidden', isFund || !!draft.place);
    const cats = [...config.categories];
    if (editing && draft.category && !cats.includes(draft.category) && !isFund) cats.push(draft.category);
    $('catChips').innerHTML = chipsHTML(cats.map(c => ({ value: c, label: catLabel(c), icon: iconFor(c) })), draft.category);

    const today = todayStr();
    $('dateChips').innerHTML = chipsHTML([{ value: today, label: t.today }, { value: shiftDay(today, -1), label: t.yesterday }], $('entryDate').value);
    $('entryDelete').classList.toggle('hidden', !editing);
    $('entrySaveMore').classList.toggle('hidden', editing);
    updateTotals();

  function pickVendor(vid) {
    if (vid === '__orphan' || draft.vendorId === vid) { draft.vendorId = ''; draft.place = ''; draft.itemId = ''; }
    else {
      const v = config.vendors.find(x => x.id === vid);
      if (!v) return;
      draft.vendorId = v.id; draft.place = v.name; draft.category = v.category; draft.itemId = '';
    }
    renderEntrySheet();
  }
  function applyMenu(id) {
    const v = vendorFor(draft);
    const m = v && v.items.find(x => x.id === id);
    if (!m) return;
    draft.itemId = id;
    $('entryMemo').value = m.name;
    const price = Number(m.price) || 0;
    sheetUnit = unitOf();
    if (price && price % sheetUnit !== 0) sheetUnit = 1;
    $('entryAmount').value = price ? fmt(price / sheetUnit) : '';
    $('entryQty').value = String(m.qtyMode === 'pax' && curPax() ? curPax() : 1);
    renderEntrySheet();
    if (!price) $('entryAmount').focus();

  async function saveEntry(keepOpen) {
    const t = T();
    const isFund = draft.type === 'fund';
    const unitPrice = readPrice();
    if (!(unitPrice > 0)) { toast(t.alertAmount); $('entryAmount').focus(); return; }
    const qty = isFund ? 1 : readQty();
    if (unitPrice * qty >= 1000000000 && !(await askConfirm(fill(t.confirmBigAmount, { v: fmt(unitPrice * qty) }), t.confirmOk))) return;   // 단위 착각 방지
    const category = isFund ? '' : draft.category;
    const place = isFund ? '' : draft.place;
    let memo = $('entryMemo').value.trim();
    if (!memo) memo = isFund ? t.fundMemo : (place || (category ? catLabel(category) : ''));
    if (!memo) { toast(t.alertItem); $('entryMemo').focus(); return; }
    const date = $('entryDate').value || todayStr();
    const old = editingId ? curEntries.find(x => x.id === editingId) : null;
    const obj = { id: editingId || newId('e'), date, type: draft.type, category, place, unitPrice: String(unitPrice), qty, amount: String(unitPrice * qty), memo, by: old && old.by ? old.by : role };

    if (old) DB.saveEntry(curTourId, old, obj); else DB.addEntry(curTourId, obj);
    toast(old ? t.toastSaved : t.toastAdded);

    if (keepOpen && !old) {
      draft.itemId = '';
      sheetUnit = unitOf();
      $('entryAmount').value = '';
      $('entryQty').value = '1';
      $('entryMemo').value = '';
      renderEntrySheet();
      $('entryAmount').focus();
    } else {
      closeSheet();
    }
  }



  async function deleteEntry() {
    const t = T();
    const e = curEntries.find(x => x.id === editingId);
    if (!e) return;
    const info = `${e.date}  ${e.memo}  ${fmt(e.amount)} ${t.currency}`;

    toast(t.toastDeleted);

    $('guidePickChips').classList.toggle('hidden', g.length === 0);
    const s = $('tourStart').value, e = $('tourEnd').value;

    $('daysChips').innerHTML = chipsHTML([4, 5].map(d => ({ value: String(d), label: fill(t.daysN, { n: d }) })), String(n));

  function saveTour() {
    const t = T();
    const name = $('tourName').value.trim();
    const guide = $('tourGuide').value.trim();
    let start = $('tourStart').value || todayStr();
    let end = $('tourEnd').value || start;
    if (!name) { toast(t.tourNameRequired); $('tourName').focus(); return; }
    if (!guide) { toast(t.guideRequired); $('tourGuide').focus(); return; }
    if (end < start) end = start;
    const pax = parseInt($('tourPax').value.replace(/[^0-9]/g, ''), 10) || 0;
    if (pax) localStorage.setItem('lastPax', String(pax));
    if (editTourId) {
      DB.updateTour(editTourId, { name, guide, startDate: start, endDate: end, pax, guideLang: draftTourLang });
      closeSheet();
      toast(t.toastSaved);
      return;
    }
    localStorage.setItem('lastGuideLang', draftTourLang);
    const id = DB.createTour({ name, guide, startDate: start, endDate: end, pax, guideLang: draftTourLang });
    const fund = (Number($('tourFund').value.replace(/[^0-9]/g, '')) || 0) * unitOf();
    if (fund > 0) DB.addEntry(id, { id: newId('e'), date: start, type: 'fund', category: '', place: '', unitPrice: String(fund), qty: 1, amount: String(fund), memo: t.fundMemo, by: 'admin' });
    closeSheet();
    toast(t.toastAdded);
    openTour(id);
  }

  async function toggleSettle() {
    const t = T();
    if (!curTour) return;
    if (curTour.status === 'settled') {
      if (!(await askConfirm(fill(t.confirmReopen, { name: curTour.name }), t.confirmOk))) return;
      DB.updateTour(curTourId, { status: 'open', settledAt: '', settledBalance: 0 });
      toast(t.reopened);
      return;
    }
    const sm = sumEntries(curEntries);
    const bal = sm.funds - sm.spent;
    const line = `${resultInfo(bal).label}: ${fmt(Math.abs(bal))} ${t.currency}`;
    if (!(await askConfirm(fill(t.confirmSettle, { name: curTour.name, result: line }), t.settleBtn))) return;
    DB.updateTour(curTourId, { status: 'settled', settledAt: new Date().toISOString(), settledBalance: bal, fundTotal: sm.funds, spendTotal: sm.spent, entryCount: curEntries.length });
    toast(t.settleDone);
  }
  async function shareLink() {
    if (!curTour) return;
    const t = T();
    if (DB.mode === 'local' && !(await askConfirm(t.demoLinkNote, t.confirmOk))) return;   // 데모 모드 링크는 다른 기기에서 안 열림
    const url = linkFor(curTourId, curTour.guideLang || 'vi');
    const title = fill(t.shareTitle, { name: curTour.name });
    try {
      if (navigator.share) { await navigator.share({ title, text: title, url }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url); toast(t.linkCopied); }
    catch (e) { window.prompt(title, url); }
  }

    stopTourWatch();
    go('tours');
    try { await DB.removeTour(id); toast(t.toastDeleted); } catch (e) { console.error(e); toast(t.writeFail); }
  }
